<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products - UnimartX Seller</title>
    <script src="../../../../config.js"></script>
    <script src="../shared/head-shell.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/seller-base.css">
    <link rel="stylesheet" href="../shared/sidebar.css">
    <link rel="stylesheet" href="../shared/topnav.css">
    <link rel="stylesheet" href="../assets/css/seller-os.css">
    <link rel="stylesheet" href="../assets/css/product-list.css">
</head>
<body>

    <div id="app-shell">

    <!-- MAIN -->
    <div class="os-main" id="seller-main">
        <div class="os-page">

            <!-- ── KPI / summary row ── -->
            <div class="stats-grid" id="prod-stats">
                <div class="stat-card" data-stat="total">
                    <div class="stat-icon stat-icon--brand"><i data-lucide="package"></i></div>
                    <div class="stat-info">
                        <p class="stat-label">Total Products</p>
                        <p class="stat-value" id="stat-total">0</p>
                        <p class="stat-sub" id="stat-total-sub">in my catalog</p>
                    </div>
                </div>
                <div class="stat-card" data-stat="active">
                    <div class="stat-icon stat-icon--success"><i data-lucide="check-circle-2"></i></div>
                    <div class="stat-info">
                        <p class="stat-label">Published</p>
                        <p class="stat-value" id="stat-active">0</p>
                        <p class="stat-sub" id="stat-active-sub">visible to buyers</p>
                    </div>
                </div>
                <div class="stat-card" data-stat="low">
                    <div class="stat-icon stat-icon--warning"><i data-lucide="alert-triangle"></i></div>
                    <div class="stat-info">
                        <p class="stat-label">Low Stock</p>
                        <p class="stat-value" id="stat-low">0</p>
                        <p class="stat-sub">needs restocking</p>
                    </div>
                </div>
                <div class="stat-card" data-stat="out">
                    <div class="stat-icon stat-icon--danger"><i data-lucide="package-x"></i></div>
                    <div class="stat-info">
                        <p class="stat-label">Out of Stock</p>
                        <p class="stat-value" id="stat-out">0</p>
                        <p class="stat-sub">unavailable</p>
                    </div>
                </div>
            </div>

            <!-- ── Toolbar ── -->
            <div class="os-card" style="padding:var(--os-space-4) var(--os-space-5);margin-bottom:var(--os-space-5);display:flex;align-items:center;justify-content:space-between;gap:var(--os-space-4);flex-wrap:wrap;">
                <div style="display:flex;align-items:center;gap:var(--os-space-3);" class="filter-tabs" id="filter-tabs">
                    <button class="os-btn os-btn-ghost os-btn-sm filter-tab active" data-filter="all" style="border-radius:var(--os-radius);">All</button>
                    <button class="os-btn os-btn-ghost os-btn-sm filter-tab" data-filter="active" style="border-radius:var(--os-radius);">Active</button>
                    <button class="os-btn os-btn-ghost os-btn-sm filter-tab" data-filter="draft" style="border-radius:var(--os-radius);">Draft</button>
                    <button class="os-btn os-btn-ghost os-btn-sm filter-tab" data-filter="low-stock" style="border-radius:var(--os-radius);color:var(--os-warning);">Low Stock</button>
                </div>
                <div style="display:flex;align-items:center;gap:var(--os-space-3);" class="toolbar-right">
                    <div class="prod-search" style="display:flex;align-items:center;gap:var(--os-space-2);background:var(--os-bg-3);border:1px solid var(--os-border);border-radius:var(--os-radius);padding:0 var(--os-space-3);width:220px;">
                        <i data-lucide="search" style="width:15px;height:15px;stroke:var(--os-text-3);flex-shrink:0;"></i>
                        <input type="search" id="product-search" placeholder="Search my products…" style="background:none;border:none;outline:none;color:var(--os-text);font-family:var(--os-font);font-size:var(--os-text-sm);padding:var(--os-space-3) 0;width:100%;">
                    </div>
                    <select id="product-sort" aria-label="Sort products" style="background:var(--os-bg-3);border:1px solid var(--os-border);border-radius:var(--os-radius);padding:var(--os-space-2) var(--os-space-3);font-family:var(--os-font);font-size:var(--os-text-sm);color:var(--os-text-2);cursor:pointer;">
                        <option value="name-asc">Name (A–Z)</option>
                        <option value="name-desc">Name (Z–A)</option>
                        <option value="price-asc">Price (Low → High)</option>
                        <option value="price-desc">Price (High → Low)</option>
                        <option value="stock-asc">Stock (Low → High)</option>
                        <option value="stock-desc">Stock (High → Low)</option>
                    </select>
                    <button class="view-toggle" id="btn-select" aria-pressed="false" style="display:inline-flex;align-items:center;gap:6px;padding:var(--os-space-2) var(--os-space-3);border-radius:var(--os-radius);background:var(--os-bg-3);border:1px solid var(--os-border);color:var(--os-text-2);font-size:var(--os-text-xs);font-weight:700;cursor:pointer;transition:all 0.15s;font-family:var(--os-font);">
                        <i data-lucide="list-checks" style="width:14px;height:14px;stroke:currentColor;"></i><span>Select</span>
                    </button>
                    <div class="view-toggle" style="display:flex;gap:var(--os-space-1);">
                        <button class="view-btn active" id="btn-grid" aria-label="Grid view" title="Grid view" style="width:36px;height:36px;border-radius:var(--os-radius);background:var(--os-bg-3);border:1px solid var(--os-border);display:flex;align-items:center;justify-content:center;color:var(--os-text-2);cursor:pointer;transition:all 0.15s;">
                            <i data-lucide="grid-2x2" style="width:15px;height:15px;stroke:currentColor;"></i>
                        </button>
                        <button class="view-btn" id="btn-list" aria-label="Table view" title="Table view" style="width:36px;height:36px;border-radius:var(--os-radius);background:var(--os-bg-3);border:1px solid var(--os-border);display:flex;align-items:center;justify-content:center;color:var(--os-text-2);cursor:pointer;transition:all 0.15s;">
                            <i data-lucide="table-2" style="width:15px;height:15px;stroke:currentColor;"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ── Bulk action bar ── -->
            <div class="bulk-bar hidden" id="bulk-bar">
                <label class="bulk-selectall">
                    <input type="checkbox" id="select-all">
                    <span>Select all</span>
                </label>
                <span class="bulk-count" id="bulk-count">0 selected</span>
                <div class="bulk-actions">
                    <button class="bulk-btn" data-bulk="publish"><i data-lucide="eye"></i> Publish</button>
                    <button class="bulk-btn" data-bulk="unpublish"><i data-lucide="eye-off"></i> Unpublish</button>
                    <button class="bulk-btn bulk-btn--danger" data-bulk="delete"><i data-lucide="trash-2"></i> Delete</button>
                </div>
                <button class="bulk-clear" id="bulk-clear">Clear</button>
            </div>

            <!-- ── Empty state ── -->
            <div class="empty-state hidden" id="no-results">
                <div class="empty-state-icon"><i data-lucide="search-x"></i></div>
                <h3>No products found</h3>
                <p>Try a different search or filter.</p>
            </div>

            <!-- ── Products grid / table ── -->
            <div class="products-wrap grid-view" id="products-wrap"></div>

        </div>
    </div>
    </div><!-- /app-shell -->
    <script defer src="../shared/shell.js"></script>

    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script>if(window.lucide)lucide.createIcons();else window.addEventListener('DOMContentLoaded',function(){if(window.lucide)lucide.createIcons();});</script>
    <script defer src="../shared/polling.js"></script>
    
    
    <script defer src="../assets/js/product-list.js" id="page-script"></script>

</body>
</html>
