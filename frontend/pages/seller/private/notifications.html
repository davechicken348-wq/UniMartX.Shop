<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - UnimartX Seller</title>
    <script src="../../../config.js"></script>
    <script src="./shared/head-shell.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/seller-base.css">
    <link rel="stylesheet" href="shared/sidebar.css">
    <link rel="stylesheet" href="shared/topnav.css">
    <link rel="stylesheet" href="./assets/css/seller-os.css">
    <link rel="stylesheet" href="./assets/css/notifications.css">
</head>
<body>

    <div id="app-shell">

    <!-- MAIN -->
    <div class="seller-main" id="seller-main">
        <div class="page-content">

            <!-- ══ Notification Center Hero ══ -->
            <section class="notif-hero">
                <div class="notif-hero-icon"><i data-lucide="bell-ring"></i></div>
                <div class="notif-hero-text">
                    <div class="notif-hero-title-row">
                        <h1>Notification Center</h1>
                        <span class="notif-hero-badge" id="hero-unread-badge">0 unread</span>
                    </div>
                    <p>Central command for every alert across your seller platform — orders, inventory, payouts, and system events.</p>
                </div>
                <a href="./profile/account-settings.html#notifications" class="btn btn-ghost btn-sm notif-hero-prefs">
                    <i data-lucide="sliders-horizontal"></i> Manage Preferences
                </a>
            </section>

            <!-- ══ Summary stats ══ -->
            <div class="stats-grid">
                <div class="stat-card stat-card--unread">
                    <div class="stat-icon"><i data-lucide="mail"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" id="stat-unread">0</span>
                        <span class="stat-label">Unread</span>
                    </div>
                </div>
                <div class="stat-card stat-card--orders">
                    <div class="stat-icon"><i data-lucide="shopping-bag"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" id="stat-orders">0</span>
                        <span class="stat-label">Orders</span>
                    </div>
                </div>
                <div class="stat-card stat-card--products">
                    <div class="stat-icon"><i data-lucide="package"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" id="stat-products">0</span>
                        <span class="stat-label">Products</span>
                    </div>
                </div>
                <div class="stat-card stat-card--system">
                    <div class="stat-icon"><i data-lucide="shield"></i></div>
                    <div class="stat-info">
                        <span class="stat-value" id="stat-system">0</span>
                        <span class="stat-label">System</span>
                    </div>
                </div>
            </div>

            <!-- ══ Toolbar ══ -->
            <div class="notif-toolbar">
                <div class="notif-filters">
                    <button class="notif-filter active" data-filter="all">All <span class="notif-filter-count" id="count-all">0</span></button>
                    <button class="notif-filter" data-filter="unread">Unread <span class="notif-filter-count" id="count-unread">0</span></button>
                    <button class="notif-filter" data-filter="orders">Orders <span class="notif-filter-count" id="count-orders">0</span></button>
                    <button class="notif-filter" data-filter="products">Products <span class="notif-filter-count" id="count-products">0</span></button>
                    <button class="notif-filter" data-filter="system">System <span class="notif-filter-count" id="count-system">0</span></button>
                </div>
                <button class="topnav-pill" id="mark-all-read">
                    <i data-lucide="check-check"></i> <span>Mark all read</span>
                </button>
            </div>

            <!-- Notifications list -->
            <div class="notifications-list" id="notifications-list">
                <!-- Populated by JS -->
            </div>

            <!-- Load more -->
            <button class="load-more-btn" id="load-more" style="margin-top: 2rem;">
                <i data-lucide="chevron-down"></i> Load More
            </button>
        </div>
    </div>
    </div><!-- /app-shell -->
    <script defer src="./shared/shell.js"></script>

    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script>if(window.lucide)lucide.createIcons();else window.addEventListener('DOMContentLoaded',function(){if(window.lucide)lucide.createIcons();});</script>
    <script defer src="./shared/polling.js"></script>
    
    
    <script defer src="./assets/js/notifications.js" id="page-script"></script>
</body>
</html>
